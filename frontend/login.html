<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="auth-container">

  
    <h2 class="app-title">Expense Manager</h2>
    <h1>Login</h1>

    <div class="auth-section">

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">
            Login
        </button>

    </div>

    <p>

        Don't have an account?

        <a href="register.html">

            Register

        </a>

    </p>

</div>

<script src="login.js"></script>

</body>

</html>
