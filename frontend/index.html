<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Expense Manager</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    </head>

    <body>

        <div class="container">

        
       <div class="header">

    <div class="header-left">

        <h1>Expense Manager</h1>

        <p class="subtitle">
            Track and manage your daily expenses
        </p>

    </div>

    <div class="header-right">
   
    <button id="theme-btn">
    <span id="theme-icon" style="font-size:22px;">🌙</span>
    <span id="theme-text">Dark</span>
</button>
    <button id="logout-btn">
        ⏻ Logout
    </button>
    </div>


</div>
       

        <div class="dashboard">

             <div class="card">

    <div class="card-top">

        <div class="icon-circle">
            <i class="fa-solid fa-wallet"></i>
        </div>

        <div class="card-content">

            <span class="card-label">
                Total Expenses
            </span>

            

            <h2 id="total-expense">
                ₹0
            </h2>

        </div>

    </div>
</div>


            <div class="card">

    <div class="card-top">

        <div class="icon-circle">
            <i class="fa-solid fa-clipboard-list"></i>
        </div>

        <div class="card-content">

            <span class="card-label">Total Entries</span>
           <h2 id="total-count">0</h2>

        </div>

    </div>

</div>

            <div class="card">

    <div class="card-top">

       <div class="icon-circle">
        <i class="fa-solid fa-arrow-trend-up"></i>
        </div>


        <div class="card-content">

           <span class="card-label">Highest Expense</span>

           <h2 id="highest-expense">₹0</h2>

        </div>

    </div>

</div>
               
            <div class="card">

    <div class="card-top">

        <div class="icon-circle">
            <i class="fa-solid fa-chart-column"></i>
        </div>

        <div class="card-content">

           <span class="card-label">Average Expense</span>

           <h2 id="average-expense">₹0</h2>

        </div>

    </div>

</div>

</div>

            
            

        <div class="charts">

              <div class="chart-container">
            <canvas id="expenseChart"></canvas>
        </div>

        <div class="chart-container">
            <canvas id="lineChart"></canvas>

        </div>

        </div>

       
        
     <div class="form-section">
         <h2 class="section-title">
    <i class="fa-solid fa-circle-plus"></i>
    Add New Expense
</h2>
         <div class="expense-form">
        <input
            type="text"
            id="title"
            placeholder="Expense title"
        >

        <input
               type="number"
               id="amount"
               placeholder="Amount"
        >

        <select id="category">
         <option value="" disabled selected>Select Category</option>
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Entertainment</option>
            <option>Other</option>
       </select>
        
       
       

       <button id="add-btn" onclick="addExpense()">
            Add Expense
        </button>
        </div>
     </div>

         <div class="controls">

    <div class="top-controls">

        <div class="total-card">
           <span>Current Total</span>
           <span id="total">₹0</span>
       </div>
        
        <div class="button-row">

        <button id="toggle-btn" onclick="toggleExpenses()">
            View Expenses
        </button>

        <button id ="HL" onclick="sortHighToLow()">
            High -> Low
        </button>

        <button id = "LH" onclick="sortLowToHigh()">
            Low -> High
        </button>

        </div>

        <div>
        </div>
     </div>

            <div class="filter-row">

        
          <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>

    <input
        type="text"
        id="search"
        placeholder="Search expenses"
        onkeyup="getExpenses()"
    >
</div>

        <select id="filter-category" onchange="getExpenses()">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
        
        
        </select>

        <input 
           type="date"
           id="date-filter"
           onchange="getExpenses()"
        />

        </div>

        </div>

        

        <div id="loader" class="loader"></div>

       <div id="expense-list">

    <table class="expense-table">

        <thead>

            <tr>

                <th>Title</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Date</th>
                <th>Actions</th>

            </tr>

        </thead>

        <tbody id="expense-body">

        </tbody>

    </table>

</div>


        
    
        

        <div id="deleteModal" class="modal">

    <div class="modal-content">

        <h2>Delete Expense?</h2>

        <p>
            Are you sure you want to delete this expense?
        </p>

        <div class="modal-buttons">

            <button id="cancelDelete">
                Cancel
            </button>

            <button id="confirmDelete">
                Delete
            </button>

        </div>

    </div>

</div>

       
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
       
        <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
         
        <script src="script.js"></script>

               
    </body>
</html>
